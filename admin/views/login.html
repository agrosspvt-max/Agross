<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in - Agross Admin</title>
<link rel="icon" type="image/png" href="/assets/agross-logo.png">
<link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body data-page="login">
<main class="login"><img class="login-logo" src="/assets/agross-logo.png" alt="Agross"><h1>Admin sign in</h1>
<form id="login-form" class="card form" novalidate>
<label>Username<input name="username" autocomplete="username" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<p id="login-error" class="error" role="alert" hidden></p>
<button type="submit" class="button">Sign in</button>
</form></main>
<script src="/admin-assets/admin.js"></script>
</body>
</html>
